# Copy to .github/workflows/notify-commitrelay.yml in a WATCHED source repo.
# Requires COMMITRELAY_DISPATCH_TOKEN secret and COMMITRELAY_TARGET_REPO variable.
name: Request CommitRelay dispatch
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Existing reusable action, not custom webhook code. Uses a runner
      # once per push. For zero source-repo Actions, use a hosted webhook App.
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.COMMITRELAY_DISPATCH_TOKEN }}
          repository: ${{ vars.COMMITRELAY_TARGET_REPO }}
          event-type: commitrelay_push
          client-payload: '{"repository":"${{ github.repository }}","ref":"${{ github.ref }}"}'
